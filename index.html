<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Video Recorder - Telemetría Ampliada</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding-bottom: 40px;
        }
        .app-container {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 9 / 16;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        #webcam, #renderCanvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        #webcam {
            display: none;
        }
        /* HUD Superior Visual en Pantalla */
        .hud-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            padding: 15px;
            font-size: 0.9rem;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        /* HUD Inferior Visual en Pantalla */
        .hud-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            padding: 20px 15px 15px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .speedometer-box-ui {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(0, 255, 204, 0.4);
            border-radius: 10px;
            padding: 10px 20px;
            text-align: center;
        }
        .speed-value-ui {
            font-size: 2.2rem;
            font-weight: 900;
            line-height: 1;
            color: #00ffcc;
            font-family: monospace;
        }
        .speed-unit-ui {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #aaa;
        }
        .gps-status-ui {
            font-size: 0.85rem;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .record-pulse {
            width: 14px;
            height: 14px;
            background-color: #ff3b30;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 rgba(255, 59, 48, 0.4);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }
        .control-panel {
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="m-0"><i class="bi bi-speedometer2 text-info"></i> GPS Video Tracker</h4>
        <span id="recStatusIndicator" class="badge bg-secondary"><i class="bi bi-circle-fill"></i> Listo</span>
    </div>

    <!-- Contenedor del Video -->
    <div class="video-wrapper shadow">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="renderCanvas"></canvas>

        <!-- Capa Superior HTML (Previsualización) -->
        <div class="hud-top">
            <div>
                <div id="hudDateTime" class="fw-bold font-monospace" style="font-size: 1rem;">--/--/---- --:--:--</div>
                <div id="hudCoords" class="text-light font-monospace" style="font-size: 0.85rem;">Lat: --.-- | Lon: --.--</div>
            </div>
            <div id="hudRecBadge" class="d-none">
                <span class="record-pulse"></span> <span id="timerText" class="font-monospace ms-1 fw-bold">00:00</span>
            </div>
        </div>

        <!-- Capa Inferior HTML (Previsualización) -->
        <div class="hud-bottom">
            <div class="gps-status-ui font-monospace">
                <div><i class="bi bi-broadcast"></i> GPS: <span id="gpsAccuracy">Buscando...</span></div>
                <div><i class="bi bi-alt"></i> Altitud: <span id="hudAlt">--</span> m</div>
            </div>
            <div class="speedometer-box-ui">
                <div id="hudSpeed" class="speed-value-ui">0</div>
                <div class="speed-unit-ui">km/h</div>
            </div>
        </div>
    </div>

    <!-- Controles -->
    <div class="control-panel d-grid gap-2">
        <button id="btnToggleRecord" class="btn btn-danger btn-lg py-3 fw-bold shadow">
            <i class="bi bi-record-circle"></i> Iniciar Grabación con GPS Ampliado
        </button>
        <a id="downloadLink" style="display: none;" class="btn btn-success btn-lg py-3">
            <i class="bi bi-download"></i> Descargar Video Grabado
        </a>
    </div>

    <!-- Historial -->
    <div class="card bg-dark text-light mt-4 border-secondary">
        <div class="card-body">
            <h6 class="card-title"><i class="bi bi-folder2-open"></i> Historial de Grabaciones</h6>
            <div id="videoHistory" class="list-group list-group-flush bg-transparent mt-2">
                <small class="text-muted">No hay grabaciones previas en esta sesión.</small>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const webcam = document.getElementById('webcam');
    const renderCanvas = document.getElementById('renderCanvas');
    const ctx = renderCanvas.getContext('2d');
    
    const btnToggleRecord = document.getElementById('btnToggleRecord');
    const downloadLink = document.getElementById('downloadLink');
    const recStatusIndicator = document.getElementById('recStatusIndicator');
    const hudRecBadge = document.getElementById('hudRecBadge');
    const timerText = document.getElementById('timerText');
    const videoHistory = document.getElementById('videoHistory');

    const hudDateTime = document.getElementById('hudDateTime');
    const hudCoords = document.getElementById('hudCoords');
    const hudSpeed = document.getElementById('hudSpeed');
    const hudAccuracy = document.getElementById('gpsAccuracy');
    const hudAlt = document.getElementById('hudAlt');

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let startTime;
    let timerInterval;

    let currentSpeed = 0;
    let currentLat = 0;
    let currentLon = 0;
    let currentAlt = 0;
    let currentAccuracy = 0;

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1080 }, height: { ideal: 1920 }, facingMode: "environment" },
                audio: true
            });
            webcam.srcObject = stream;
            webcam.onloadedmetadata = () => {
                // Forzamos resolución HD vertical estándar para garantizar nitidez en el texto impreso
                renderCanvas.width = 1080;
                renderCanvas.height = 1920;
                startRenderLoop();
            };
        } catch (err) {
            alert("Error al acceder a la cámara: " + err.message);
        }
    }

    function initGPS() {
        if (!navigator.geolocation) {
            alert("La geolocalización no está soportada.");
            return;
        }

        const options = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };

        navigator.geolocation.watchPosition(
            (position) => {
                const speedMs = position.coords.speed;
                currentSpeed = speedMs !== null && !isNaN(speedMs) ? Math.round(speedMs * 3.6) : 0;
                currentLat = position.coords.latitude;
                currentLon = position.coords.longitude;
                currentAlt = position.coords.altitude ? Math.round(position.coords.altitude) : 0;
                currentAccuracy = Math.round(position.coords.accuracy);

                hudSpeed.innerText = currentSpeed;
                hudCoords.innerText = `Lat: ${currentLat.toFixed(5)} | Lon: ${currentLon.toFixed(5)}`;
                hudAccuracy.innerText = `${currentAccuracy}m`;
                hudAlt.innerText = currentAlt;
            },
            (error) => {
                console.warn("GPS Warning: ", error.message);
                hudAccuracy.innerText = "Sin señal";
            },
            options
        );
    }

    function startRenderLoop() {
        function render() {
            if (webcam.readyState === webcam.HAVE_ENOUGH_DATA) {
                // 1. Dibujar imagen de la cámara cubriendo todo el canvas
                ctx.drawImage(webcam, 0, 0, renderCanvas.width, renderCanvas.height);

                const now = new Date();
                const dateStr = now.toLocaleDateString();
                const timeStr = now.toLocaleTimeString();

                // -------------------------------------------------------------
                // 2. FRANJA SUPERIOR AMPLIADA (Ocupa el 100% del ancho)
                // -------------------------------------------------------------
                ctx.save();
                const topGrad = ctx.createLinearGradient(0, 0, 0, 180);
                topGrad.addColorStop(0, 'rgba(0, 0, 0, 0.9)');
                topGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = topGrad;
                ctx.fillRect(0, 0, renderCanvas.width, 180);

                // Textos grandes y legibles en la parte superior
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 44px monospace';
                ctx.fillText(`${dateStr}  -  ${timeStr}`, 50, 75);

                ctx.fillStyle = '#00ffcc';
                ctx.font = 'bold 36px monospace';
                ctx.fillText(`Lat: ${currentLat.toFixed(5)}  |  Lon: ${currentLon.toFixed(5)}`, 50, 135);
                ctx.restore();

                // -------------------------------------------------------------
                // 3. FRANJA INFERIOR AMPLIADA (Velocímetro y Datos GPS de lado a lado)
                // -------------------------------------------------------------
                ctx.save();
                const botGrad = ctx.createLinearGradient(0, renderCanvas.height - 220, 0, renderCanvas.height);
                botGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
                botGrad.addColorStop(1, 'rgba(0, 0, 0, 0.9)');
                ctx.fillStyle = botGrad;
                ctx.fillRect(0, renderCanvas.height - 220, renderCanvas.width, 220);

                // Panel izquierdo inferior: Precisión y Altitud en tamaño legible
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(50, renderCanvas.height - 160, 450, 110, 15);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 32px monospace';
                ctx.fillText(`GPS (±${currentAccuracy}m)`, 80, renderCanvas.height - 105);
                ctx.fillText(`Altitud: ${currentAlt} m`, 80, renderCanvas.height - 60);

                // Panel derecho inferior: Velocímetro grande y destacado
                const speedBoxWidth = 430;
                const speedBoxX = renderCanvas.width - speedBoxWidth - 50;
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.roundRect(speedBoxX, renderCanvas.height - 180, speedBoxWidth, 130, 20);
                ctx.fill();
                ctx.stroke();

                // Valor de la velocidad
                ctx.fillStyle = '#00ffcc';
                ctx.font = 'bold 85px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(currentSpeed, speedBoxX + (speedBoxWidth / 2) - 40, renderCanvas.height - 85);

                // Unidad (KM/H)
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 28px sans-serif';
                ctx.fillText('KM/H', speedBoxX + (speedBoxWidth / 2) + 120, renderCanvas.height - 95);

                ctx.restore();

                // Actualizar interfaz HTML superior
                hudDateTime.innerText = `${dateStr} ${timeStr}`;
            }
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    }

    btnToggleRecord.addEventListener('click', () => {
        if (!isRecording) {
            startRecording();
        } else {
            stopRecording();
        }
    });

    function startRecording() {
        recordedChunks = [];
        const canvasStream = renderCanvas.captureStream(30);
        const audioStream = webcam.srcObject.getAudioTracks();
        
        if (audioStream.length > 0) {
            canvasStream.addTrack(audioStream[0]);
        }

        let options = { mimeType: 'video/webm; codecs=vp9,opus' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
            options = { mimeType: 'video/webm' };
        }

        try {
            mediaRecorder = new MediaRecorder(canvasStream, options);
        } catch (e) {
            alert("No se pudo iniciar el grabador de video: " + e.message);
            return;
        }

        mediaRecorder.ondataavailable = function(event) {
            if (event.data && event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = function() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const videoURL = URL.createObjectURL(blob);
            
            downloadLink.href = videoURL;
            downloadLink.download = `GPS_Video_HD_${new Date().toISOString().slice(0,10)}.webm`;
            downloadLink.style.display = 'block';
            downloadLink.innerHTML = `<i class="bi bi-download"></i> Descargar Video (${Math.round(blob.size / 1024 / 1024 * 10) / 10} MB)`;

            saveToHistory(videoURL);
        };

        mediaRecorder.start();
        isRecording = true;
        
        btnToggleRecord.className = "btn btn-secondary btn-lg py-3 fw-bold shadow";
        btnToggleRecord.innerHTML = `<i class="bi bi-stop-circle"></i> Detener Grabación`;
        recStatusIndicator.className = "badge bg-danger animate-pulse";
        recStatusIndicator.innerHTML = `<i class="bi bi-circle-fill"></i> Grabando HD...`;
        hudRecBadge.classList.remove('d-none');
        downloadLink.style.display = 'none';

        startTime = Date.now();
        timerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const secs = String(elapsed % 60).padStart(2, '0');
            timerText.innerText = `${mins}:${secs}`;
        }, 1000);
    }

    function stopRecording() {
        mediaRecorder.stop();
        isRecording = false;

        clearInterval(timerInterval);
        btnToggleRecord.className = "btn btn-danger btn-lg py-3 fw-bold shadow";
        btnToggleRecord.innerHTML = `<i class="bi bi-record-circle"></i> Iniciar Grabación con GPS Ampliado`;
        recStatusIndicator.className = "badge bg-secondary";
        recStatusIndicator.innerHTML = `<i class="bi bi-circle-fill"></i> Listo`;
        hudRecBadge.classList.add('d-none');
    }

    function saveToHistory(url) {
        const item = document.createElement('div');
        item.className = 'list-group-item bg-transparent text-light d-flex justify-content-between align-items-center border-secondary';
        item.innerHTML = `
            <span><i class="bi bi-file-earmark-play text-info"></i> Grabación HD (${new Date().toLocaleTimeString()})</span>
            <a href="${url}" download="video_gps.webm" class="btn btn-sm btn-outline-light"><i class="bi bi-download"></i></a>
        `;
        videoHistory.prepend(item);
    }

    window.onload = () => {
        initCamera();
        initGPS();
    };
</script>

</body>
</html>

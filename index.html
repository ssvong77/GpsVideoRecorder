<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Dashcam Simulator - Tablero Inferior</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding-bottom: 40px;
        }
        .app-container {
            max-width: 550px;
            margin: auto;
            padding: 15px;
        }
        .dashcam-container {
            background: #111827;
            border: 3px solid #1f2937;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0,0,0,0.8);
        }
        .video-viewport {
            position: relative;
            width: 100%;
            background: #000;
            aspect-ratio: 4 / 3;
            overflow: hidden;
        }
        #webcam, #renderCanvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        #webcam {
            display: none;
        }
        .video-hud-top {
            position: absolute;
            top: 10px;
            right: 15px;
            z-index: 10;
            pointer-events: none;
        }
        .record-pulse {
            width: 12px;
            height: 12px;
            background-color: #ff3b30;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 rgba(255, 59, 48, 0.4);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }
        .car-dashboard {
            background: linear-gradient(180deg, #1f2937 0%, #111827 100%);
            border-top: 2px solid #374151;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dashboard-telemetry {
            font-family: monospace;
            font-size: 0.85rem;
            color: #9ca3af;
        }
        .dashboard-telemetry .highlight-text {
            color: #ffffff;
            font-weight: bold;
        }
        .dashboard-speedometer {
            background: #030712;
            border: 2px solid #00ffcc;
            border-radius: 12px;
            padding: 8px 20px;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(0,255,204,0.2);
        }
        .speed-number {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1;
            color: #00ffcc;
            font-family: monospace;
        }
        .speed-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6b7280;
        }
        .control-panel {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="m-0 text-info"><i class="bi bi-car-front-fill"></i> GPS Dashcam Recorder</h5>
        <span id="recStatusIndicator" class="badge bg-secondary"><i class="bi bi-circle-fill"></i> Listo</span>
    </div>

    <!-- Contenedor Estilo Coche -->
    <div class="dashcam-container">
        
        <div class="video-viewport">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="renderCanvas"></canvas>

            <div id="hudRecBadge" class="video-hud-top d-none">
                <span class="badge bg-dark bg-opacity-75 text-danger border border-danger">
                    <span class="record-pulse"></span> <span id="timerText" class="font-monospace ms-1">00:00</span>
                </span>
            </div>
        </div>

        <!-- Tablero de Instrumentos Inferior -->
        <div class="car-dashboard">
            <div class="dashboard-telemetry">
                <div class="mb-1"><i class="bi bi-calendar-event text-info"></i> <span id="dashDate" class="highlight-text">--/--/----</span></div>
                <div class="mb-1"><i class="bi bi-clock text-info"></i> <span id="dashTime" class="highlight-text">--:--:--</span></div>
                <div class="mb-1"><i class="bi bi-geo-alt text-danger"></i> <span id="dashCoords" class="highlight-text">Lat: -- | Lon: --</span></div>
                <div><i class="bi bi-broadcast text-warning"></i> GPS: <span id="dashGps" class="highlight-text">Buscando...</span></div>
            </div>
            
            <div class="dashboard-speedometer">
                <div id="dashSpeed" class="speed-number">0</div>
                <div class="speed-label">km/h</div>
            </div>
        </div>

    </div>

    <!-- Botón para alternar cámara -->
    <div class="mt-2 text-end">
        <button id="btnSwitchCamera" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-camera-rotate"></i> Cambiar Cámara
        </button>
    </div>

    <!-- Controles de Grabación -->
    <div class="control-panel d-grid gap-2">
        <button id="btnToggleRecord" class="btn btn-danger btn-lg py-3 fw-bold shadow">
            <i class="bi bi-record-circle"></i> Iniciar Dashcam
        </button>
        <a id="downloadLink" style="display: none;" class="btn btn-success btn-lg py-3">
            <i class="bi bi-download"></i> Descargar Video Grabado
        </a>
    </div>

    <!-- Historial -->
    <div class="card bg-dark text-light mt-4 border-secondary">
        <div class="card-body">
            <h6 class="card-title"><i class="bi bi-folder2-open"></i> Archivos Guardados</h6>
            <div id="videoHistory" class="list-group list-group-flush bg-transparent mt-2">
                <small class="text-muted">No hay grabaciones previas.</small>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const webcam = document.getElementById('webcam');
    const renderCanvas = document.getElementById('renderCanvas');
    const ctx = renderCanvas.getContext('2d');
    
    const btnToggleRecord = document.getElementById('btnToggleRecord');
    const btnSwitchCamera = document.getElementById('btnSwitchCamera');
    const downloadLink = document.getElementById('downloadLink');
    const recStatusIndicator = document.getElementById('recStatusIndicator');
    const hudRecBadge = document.getElementById('hudRecBadge');
    const timerText = document.getElementById('timerText');
    const videoHistory = document.getElementById('videoHistory');

    const dashDate = document.getElementById('dashDate');
    const dashTime = document.getElementById('dashTime');
    const dashCoords = document.getElementById('dashCoords');
    const dashGps = document.getElementById('dashGps');
    const dashSpeed = document.getElementById('dashSpeed');

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let startTime;
    let timerInterval;
    let renderLoopStarted = false;

    let currentSpeed = 0;
    let currentLat = 0;
    let currentLon = 0;
    let currentAlt = 0;
    let currentAccuracy = 0;
    
    let videoDevices = [];
    let currentDeviceIndex = 0;

    // Inicializar y detectar cámaras disponibles
    async function initCameraSystem() {
        try {
            // Solicitar un permiso inicial para que el navegador liste los nombres y IDs de las cámaras
            const initialStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            initialStream.getTracks().forEach(track => track.stop()); // Detener el temporal

            // Obtener lista de dispositivos de video
            const devices = await navigator.mediaDevices.enumerateDevices();
            videoDevices = devices.filter(device => device.kind === 'videoinput');

            if (videoDevices.length > 0) {
                // Intentar buscar por defecto una cámara trasera ("back", "rear", "environment")
                const backCameraIndex = videoDevices.findIndex(d => 
                    d.label.toLowerCase().includes('back') || 
                    d.label.toLowerCase().includes('trasera') || 
                    d.label.toLowerCase().includes('environment') ||
                    d.label.toLowerCase().includes('wide')
                );
                
                // Si encuentra una trasera, la selecciona; si no, toma la última de la lista (suele ser la principal trasera en móviles)
                currentDeviceIndex = backCameraIndex !== -1 ? backCameraIndex : (videoDevices.length > 1 ? videoDevices.length - 1 : 0);
            }

            await startStreamWithCurrentDevice();

        } catch (err) {
            console.warn("No se pudo enumerar dispositivos, intentando método estándar...", err);
            await startFallbackCamera();
        }
    }

    // Iniciar cámara usando el ID de dispositivo específico
    async function startStreamWithCurrentDevice() {
        if (webcam.srcObject) {
            webcam.srcObject.getTracks().forEach(track => track.stop());
        }

        const constraints = {
            video: videoDevices.length > 0 ? { deviceId: { exact: videoDevices[currentDeviceIndex].deviceId } } : { facingMode: "environment" },
            audio: true
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            webcam.srcObject = stream;
            
            webcam.onloadedmetadata = () => {
                renderCanvas.width = 1080;
                renderCanvas.height = 1440;
                if (!renderLoopStarted) {
                    renderLoopStarted = true;
                    startRenderLoop();
                }
            };
        } catch (err) {
            console.warn("Error con deviceId exacto, usando fallback...", err);
            await startFallbackCamera();
        }
    }

    // Fallback por facingMode si falla el ID
    async function startFallbackCamera() {
        if (webcam.srcObject) {
            webcam.srcObject.getTracks().forEach(track => track.stop());
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: true
            });
            webcam.srcObject = stream;
            webcam.onloadedmetadata = () => {
                renderCanvas.width = 1080;
                renderCanvas.height = 1440;
                if (!renderLoopStarted) {
                    renderLoopStarted = true;
                    startRenderLoop();
                }
            };
        } catch (e) {
            alert("Error crítico al abrir la cámara: " + e.message);
        }
    }

    // Botón para rotar entre todas las cámaras disponibles del dispositivo
    btnSwitchCamera.addEventListener('click', async () => {
        if (videoDevices.length > 1) {
            currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
            await startStreamWithCurrentDevice();
        } else {
            // Si solo detecta una o ninguna listada, alternar por facingMode clásico
            useFront = !window.useFront;
            window.useFront = useFront;
            if (webcam.srcObject) webcam.srcObject.getTracks().forEach(t => t.stop());
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: useFront ? "user" : "environment" },
                audio: true
            });
            webcam.srcObject = stream;
        }
    });

    function initGPS() {
        if (!navigator.geolocation) {
            alert("La geolocalización no está soportada.");
            return;
        }

        const options = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };

        navigator.geolocation.watchPosition(
            (position) => {
                const speedMs = position.coords.speed;
                currentSpeed = speedMs !== null && !isNaN(speedMs) ? Math.round(speedMs * 3.6) : 0;
                currentLat = position.coords.latitude;
                currentLon = position.coords.longitude;
                currentAlt = position.coords.altitude ? Math.round(position.coords.altitude) : 0;
                currentAccuracy = Math.round(position.coords.accuracy);

                dashSpeed.innerText = currentSpeed;
                dashCoords.innerText = `Lat: ${currentLat.toFixed(4)} | Lon: ${currentLon.toFixed(4)}`;
                dashGps.innerText = `±${currentAccuracy}m | Alt: ${currentAlt}m`;
            },
            (error) => {
                console.warn("GPS Warning: ", error.message);
                dashGps.innerText = "Sin señal GPS";
            },
            options
        );
    }

    function startRenderLoop() {
        function render() {
            if (webcam.readyState === webcam.HAVE_ENOUGH_DATA) {
                const canvasW = renderCanvas.width;
                const canvasH = renderCanvas.height;
                const videoAreaH = canvasW * 0.75;

                // Dibujar video limpio arriba
                ctx.drawImage(webcam, 0, 0, canvasW, videoAreaH);

                // Dibujar Tablero abajo
                ctx.save();
                ctx.fillStyle = '#111827';
                ctx.fillRect(0, videoAreaH, canvasW, canvasH - videoAreaH);

                ctx.strokeStyle = '#374151';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(0, videoAreaH);
                ctx.lineTo(canvasW, videoAreaH);
                ctx.stroke();

                const now = new Date();
                const dateStr = now.toLocaleDateString();
                const timeStr = now.toLocaleTimeString();

                ctx.fillStyle = '#9ca3af';
                ctx.font = 'bold 30px monospace';
                ctx.fillText(`FECHA:`, 50, videoAreaH + 65);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(dateStr, 200, videoAreaH + 65);

                ctx.fillStyle = '#9ca3af';
                ctx.fillText(`HORA:`, 50, videoAreaH + 120);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(timeStr, 200, videoAreaH + 120);

                ctx.fillStyle = '#9ca3af';
                ctx.fillText(`GPS:`, 50, videoAreaH + 175);
                ctx.fillStyle = '#00ffcc';
                ctx.font = 'bold 26px monospace';
                ctx.fillText(`Lat:${currentLat.toFixed(4)} Lon:${currentLon.toFixed(4)}`, 200, videoAreaH + 175);

                ctx.fillStyle = '#9ca3af';
                ctx.font = 'bold 30px monospace';
                ctx.fillText(`ALT/PREC:`, 50, videoAreaH + 230);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(`${currentAlt}m (±${currentAccuracy}m)`, 240, videoAreaH + 230);

                const speedBoxW = 320;
                const speedBoxH = 200;
                const speedBoxX = canvasW - speedBoxW - 50;
                const speedBoxY = videoAreaH + 40;

                ctx.fillStyle = '#030712';
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.roundRect(speedBoxX, speedBoxY, speedBoxW, speedBoxH, 20);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#00ffcc';
                ctx.font = 'bold 110px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(currentSpeed, speedBoxX + (speedBoxW / 2), speedBoxY + 130);

                ctx.fillStyle = '#9ca3af';
                ctx.font = 'bold 24px sans-serif';
                ctx.fillText('KM/H', speedBoxX + (speedBoxW / 2), speedBoxY + 175);

                ctx.restore();

                dashDate.innerText = dateStr;
                dashTime.innerText = timeStr;
            }
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    }

    btnToggleRecord.addEventListener('click', () => {
        if (!isRecording) {
            startRecording();
        } else {
            stopRecording();
        }
    });

    function startRecording() {
        recordedChunks = [];
        const canvasStream = renderCanvas.captureStream(30);
        const audioStream = webcam.srcObject.getAudioTracks();
        
        if (audioStream.length > 0) {
            canvasStream.addTrack(audioStream[0]);
        }

        let options = { mimeType: 'video/webm; codecs=vp9,opus' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
            options = { mimeType: 'video/webm' };
        }

        try {
            mediaRecorder = new MediaRecorder(canvasStream, options);
        } catch (e) {
            alert("No se pudo iniciar el grabador: " + e.message);
            return;
        }

        mediaRecorder.ondataavailable = function(event) {
            if (event.data && event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = function() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const videoURL = URL.createObjectURL(blob);
            
            downloadLink.href = videoURL;
            downloadLink.download = `Dashcam_Video_${new Date().toISOString().slice(0,10)}.webm`;
            downloadLink.style.display = 'block';
            downloadLink.innerHTML = `<i class="bi bi-download"></i> Descargar Video del Tablero (${Math.round(blob.size / 1024 / 1024 * 10) / 10} MB)`;

            saveToHistory(videoURL);
        };

        mediaRecorder.start();
        isRecording = true;
        
        btnToggleRecord.className = "btn btn-secondary btn-lg py-3 fw-bold shadow";
        btnToggleRecord.innerHTML = `<i class="bi bi-stop-circle"></i> Detener Grabación`;
        recStatusIndicator.className = "badge bg-danger animate-pulse";
        recStatusIndicator.innerHTML = `<i class="bi bi-circle-fill"></i> Grabando...`;
        hudRecBadge.classList.remove('d-none');
        downloadLink.style.display = 'none';

        startTime = Date.now();
        timerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const secs = String(elapsed % 60).padStart(2, '0');
            timerText.innerText = `${mins}:${secs}`;
        }, 1000);
    }

    function stopRecording() {
        mediaRecorder.stop();
        isRecording = false;

        clearInterval(timerInterval);
        btnToggleRecord.className = "btn btn-danger btn-lg py-3 fw-bold shadow";
        btnToggleRecord.innerHTML = `<i class="bi bi-record-circle"></i> Iniciar Dashcam`;
        recStatusIndicator.className = "badge bg-secondary";
        recStatusIndicator.innerHTML = `<i class="bi bi-circle-fill"></i> Listo`;
        hudRecBadge.classList.add('d-none');
    }

    function saveToHistory(url) {
        const item = document.createElement('div');
        item.className = 'list-group-item bg-transparent text-light d-flex justify-content-between align-items-center border-secondary';
        item.innerHTML = `
            <span><i class="bi bi-file-earmark-play text-info"></i> Dashcam (${new Date().toLocaleTimeString()})</span>
            <a href="${url}" download="dashcam.webm" class="btn btn-sm btn-outline-light"><i class="bi bi-download"></i></a>
        `;
        videoHistory.prepend(item);
    }

    window.onload = () => {
        initCameraSystem();
        initGPS();
    };
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Video Recorder - Telemetría en Vivo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding-bottom: 40px;
        }
        .app-container {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 9 / 16;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        #webcam, #renderCanvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        #webcam {
            display: none; /* Se procesa a través del canvas */
        }
        /* Capa de Información Superior (No invasiva) */
        .hud-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
            padding: 12px 15px;
            font-size: 0.8rem;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            pointer-events: none;
        }
        /* Capa de Velocímetro Inferior (No invasiva) */
        .hud-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            padding: 20px 15px 15px 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 10;
            pointer-events: none;
        }
        .speedometer-box {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            border-radius: 10px;
            padding: 8px 16px;
            text-align: center;
        }
        .speed-value {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
            color: #00ffcc;
            font-family: monospace;
        }
        .speed-unit {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
        }
        .gps-status {
            font-size: 0.75rem;
            background: rgba(0,0,0,0.6);
            padding: 6px 10px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
        }
        .record-pulse {
            width: 14px;
            height: 14px;
            background-color: #ff3b30;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 rgba(255, 59, 48, 0.4);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }
        .control-panel {
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="m-0"><i class="bi bi-speedometer2 text-info"></i> GPS Video Tracker</h4>
        <span id="recStatusIndicator" class="badge bg-secondary"><i class="bi bi-circle-fill"></i> Listo</span>
    </div>

    <!-- Contenedor del Video / Visor -->
    <div class="video-wrapper shadow">
        <!-- Elemento de video fuente oculto -->
        <video id="webcam" autoplay playsinline muted></video>
        <!-- Canvas donde se renderiza la cámara + HUD (Grabable) -->
        <canvas id="renderCanvas"></canvas>

        <!-- Capa Superior HUD (Fecha, Hora, Coordenadas) -->
        <div class="hud-top">
            <div>
                <div id="hudDateTime" class="fw-bold font-monospace">--/--/---- --:--:--</div>
                <div id="hudCoords" class="text-light opacity-75 font-monospace" style="font-size: 0.7rem;">Lat: --.-- | Lon: --.--</div>
            </div>
            <div id="hudRecBadge" class="d-none">
                <span class="record-pulse"></span> <span id="timerText" class="font-monospace ms-1">00:00</span>
            </div>
        </div>

        <!-- Capa Inferior HUD (Velocímetro y Precisión) -->
        <div class="hud-bottom">
            <div class="gps-status">
                <div><i class="bi bi-broadcast"></i> GPS: <span id="gpsAccuracy">Buscando...</span></div>
                <div><i class="bi bi-alt"></i> Alt: <span id="hudAlt">--</span> m</div>
            </div>
            <div class="speedometer-box">
                <div id="hudSpeed" class="speed-value">0</div>
                <div class="speed-unit">km/h</div>
            </div>
        </div>
    </div>

    <!-- Controles de Grabación -->
    <div class="control-panel d-grid gap-2">
        <button id="btnToggleRecord" class="btn btn-danger btn-lg py-3 fw-bold shadow">
            <i class="bi bi-record-circle"></i> Iniciar Grabación con GPS
        </button>
        <a id="downloadLink" style="display: none;" class="btn btn-success btn-lg py-3">
            <i class="bi bi-download"></i> Descargar Video Grabado
        </a>
    </div>

    <!-- Listado de videos guardados localmente -->
    <div class="card bg-dark text-light mt-4 border-secondary">
        <div class="card-body">
            <h6 class="card-title"><i class="bi bi-folder2-open"></i> Historial de Grabaciones (Guardadas en navegador)</h6>
            <div id="videoHistory" class="list-group list-group-flush bg-transparent mt-2">
                <small class="text-muted">No hay grabaciones previas en esta sesión.</small>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const webcam = document.getElementById('webcam');
    const renderCanvas = document.getElementById('renderCanvas');
    const ctx = renderCanvas.getContext('2d');
    
    const btnToggleRecord = document.getElementById('btnToggleRecord');
    const downloadLink = document.getElementById('downloadLink');
    const recStatusIndicator = document.getElementById('recStatusIndicator');
    const hudRecBadge = document.getElementById('hudRecBadge');
    const timerText = document.getElementById('timerText');
    const videoHistory = document.getElementById('videoHistory');

    // Elementos HUD Visuales
    const hudDateTime = document.getElementById('hudDateTime');
    const hudCoords = document.getElementById('hudCoords');
    const hudSpeed = document.getElementById('hudSpeed');
    const hudAccuracy = document.getElementById('gpsAccuracy');
    const hudAlt = document.getElementById('hudAlt');

    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;
    let startTime;
    let timerInterval;

    // Estado del GPS
    let currentSpeed = 0; // km/h
    let currentLat = 0;
    let currentLon = 0;
    let currentAlt = 0;
    let currentAccuracy = 0;

    // Inicializar Cámara
    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1080 }, height: { ideal: 1920 }, facingMode: "environment" },
                audio: true
            });
            webcam.srcObject = stream;
            webcam.onloadedmetadata = () => {
                renderCanvas.width = webcam.videoWidth || 720;
                renderCanvas.height = webcam.videoHeight || 1280;
                startRenderLoop();
            };
        } catch (err) {
            alert("Error al acceder a la cámara: " + err.message);
        }
    }

    // Inicializar Geolocalización GPS
    function initGPS() {
        if (!navigator.geolocation) {
            alert("La geolocalización no está soportada en este navegador.");
            return;
        }

        const options = {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        };

        navigator.geolocation.watchPosition(
            (position) => {
                // position.speed viene en metros por segundo (m/s). Convertimos a km/h (* 3.6)
                const speedMs = position.coords.speed;
                currentSpeed = speedMs !== null && !isNaN(speedMs) ? Math.round(speedMs * 3.6) : 0;
                currentLat = position.coords.latitude;
                currentLon = position.coords.longitude;
                currentAlt = position.coords.altitude ? Math.round(position.coords.altitude) : 0;
                currentAccuracy = Math.round(position.coords.accuracy);

                // Actualizar UI en Pantalla
                hudSpeed.innerText = currentSpeed;
                hudCoords.innerText = `Lat: ${currentLat.toFixed(5)} | Lon: ${currentLon.toFixed(5)}`;
                hudAccuracy.innerText = `${currentAccuracy}m`;
                hudAlt.innerText = currentAlt;
            },
            (error) => {
                console.warn("Error de GPS: ", error.message);
                hudAccuracy.innerText = "Sin señal";
            },
            options
        );
    }

    // Bucle de Renderizado en Canvas (Superpone la telemetría en tiempo real sobre el video)
    function startRenderLoop() {
        function render() {
            if (webcam.readyState === webcam.HAVE_ENOUGH_DATA) {
                // 1. Dibujar fotograma de cámara
                ctx.drawImage(webcam, 0, 0, renderCanvas.width, renderCanvas.height);

                // 2. Preparar datos de Fecha y Hora actual
                const now = new Date();
                const dateStr = now.toLocaleDateString();
                const timeStr = now.toLocaleTimeString();

                // --- DIBUJAR HUD SUPERIOR (No invasivo) ---
                ctx.save();
                // Fondo semitransparente superior
                const topGrad = ctx.createLinearGradient(0, 0, 0, renderCanvas.height * 0.15);
                topGrad.addColorStop(0, 'rgba(0, 0, 0, 0.7)');
                topGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = topGrad;
                ctx.fillRect(0, 0, renderCanvas.width, renderCanvas.height * 0.15);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px monospace';
                ctx.fillText(`${dateStr} ${timeStr}`, 30, 45);

                ctx.font = '18px monospace';
                ctx.fillStyle = '#cccccc';
                ctx.fillText(`Lat: ${currentLat.toFixed(5)} | Lon: ${currentLon.toFixed(5)} (±${currentAccuracy}m)`, 30, 75);
                ctx.restore();

                // --- DIBUJAR HUD INFERIOR (Velocímetro y Altitud) ---
                ctx.save();
                const botGrad = ctx.createLinearGradient(0, renderCanvas.height * 0.85, 0, renderCanvas.height);
                botGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
                botGrad.addColorStop(1, 'rgba(0, 0, 0, 0.8)');
                ctx.fillStyle = botGrad;
                ctx.fillRect(0, renderCanvas.height * 0.85, renderCanvas.width, renderCanvas.height * 0.15);

                // Caja del Velocímetro (Esquina Inferior Derecha)
                const boxWidth = 220;
                const boxHeight = 110;
                const boxX = renderCanvas.width - boxWidth - 30;
                const boxY = renderCanvas.height - boxHeight - 40;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 15);
                ctx.fill();
                ctx.stroke();

                // Texto de velocidad
                ctx.fillStyle = '#00ffcc';
                ctx.font = 'bold 55px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(currentSpeed, boxX + (boxWidth / 2), boxY + 60);

                ctx.fillStyle = '#aaaaaa';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('KM/H', boxX + (boxWidth / 2), boxY + 92);

                // Info de Altitud / GPS (Esquina Inferior Izquierda)
                ctx.textAlign = 'left';
                ctx.fillStyle = '#ffffff';
                ctx.font = '18px monospace';
                ctx.fillText(`Altitud: ${currentAlt} m`, 30, renderCanvas.height - 60);
                ctx.restore();

                // Actualizar interfaz visual superior en tiempo real
                hudDateTime.innerText = `${dateStr} ${timeStr}`;
            }
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    }

    // Control de Grabación
    btnToggleRecord.addEventListener('click', () => {
        if (!isRecording) {
            startRecording();
        } else {
            stopRecording();
        }
    });

    function startRecording() {
        recordedChunks = [];
        // Capturar stream del Canvas con audio de la cámara
        const canvasStream = renderCanvas.captureStream(30); // 30 FPS
        const audioStream = webcam.srcObject.getAudioTracks();
        
        if (audioStream.length > 0) {
            canvasStream.addTrack(audioStream[0]);
        }

        let options = { mimeType: 'video/webm; codecs=vp9,opus' };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
            options = { mimeType: 'video/webm' };
        }

        try {
            mediaRecorder = new MediaRecorder(canvasStream, options);
        } catch (e) {
            alert("No se pudo iniciar el grabador de video: " + e.message);
            return;
        }

        mediaRecorder.ondataavailable = function(event) {
            if (event.data && event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = function() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const videoURL = URL.createObjectURL(blob);
            
            downloadLink.href = videoURL;
            downloadLink.download = `GPS_Video_${new Date().toISOString().slice(0,10)}.webm`;
            downloadLink.style.display = 'block';
            downloadLink.innerHTML = `<i class="bi bi-download"></i> Descargar Video (${Math.round(blob.size / 1024 / 1024 * 10) / 10} MB)`;

            // Guardar referencia en localStorage / historial visual
            saveToHistory(videoURL);
        };

        mediaRecorder.start();
        isRecording = true;
        
        // Cambiar estados visuales
        btnToggleRecord.className = "btn btn-secondary btn-lg py-3 fw-bold shadow";
        btnToggleRecord.innerHTML = `<i class="bi bi-stop-circle"></i> Detener Grabación`;
        recStatusIndicator.className = "badge bg-danger animate-pulse";
        recStatusIndicator.innerHTML = `<i class="bi bi-circle-fill"></i> Grabando...`;
        hudRecBadge.classList.remove('d-none');
        downloadLink.style.display = 'none';

        // Iniciar temporizador
        startTime = Date.now();
        timerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const secs = String(elapsed % 60).padStart(2, '0');
            timerText.innerText = `${mins}:${secs}`;
        }, 1000);
    }

    function stopRecording() {
        mediaRecorder.stop();
        isRecording = false;

        clearInterval(timerInterval);
        btnToggleRecord.className = "btn btn-danger btn-lg py-3 fw-bold shadow";
        btnToggleRecord.innerHTML = `<i class="bi bi-record-circle"></i> Iniciar Grabación con GPS`;
        recStatusIndicator.className = "badge bg-secondary";
        recStatusIndicator.innerHTML = `<i class="bi bi-circle-fill"></i> Listo`;
        hudRecBadge.classList.add('d-none');
    }

    function saveToHistory(url) {
        const item = document.createElement('div');
        item.className = 'list-group-item bg-transparent text-light d-flex justify-content-between align-items-center border-secondary';
        item.innerHTML = `
            <span><i class="bi bi-file-earmark-play text-info"></i> Grabación de ${new Date().toLocaleTimeString()}</span>
            <a href="${url}" download="video_gps.webm" class="btn btn-sm btn-outline-light"><i class="bi bi-download"></i></a>
        `;
        videoHistory.prepend(item);
    }

    // Inicializar al cargar la página
    window.onload = () => {
        initCamera();
        initGPS();
    };
</script>

</body>
</html>
